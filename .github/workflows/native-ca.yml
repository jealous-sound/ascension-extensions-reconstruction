name: Native character advancement

on:
  push:
  pull_request:

jobs:
  portable-packets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -B tests/native_ca_packets.py
      - run: python3 -B tests/native_callback_order.py
  windows-dll:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32
      - run: cmake --build build --config RelWithDebInfo --parallel 4
